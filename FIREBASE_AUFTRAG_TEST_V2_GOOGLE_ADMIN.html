<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebase Auftrag Test V2</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f7;margin:0;padding:20px}
.box{max-width:760px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 12px #0002}
input,button{font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;margin:4px 0}
input{width:calc(100% - 22px)} button{cursor:pointer}
#status{margin:12px 0;padding:10px;background:#eee;border-radius:8px;font-weight:bold}
.row{padding:9px;border-bottom:1px solid #eee}
pre{background:#111;color:#eee;padding:12px;border-radius:8px;max-height:320px;overflow:auto;white-space:pre-wrap;font-size:12px}
.small{font-size:13px;color:#666}.admin{background:#eaf4ff}
</style>
</head><body><div class="box">
<h2>Firebase Auftrag – Admin/Monteur Test V2</h2>
<p>Nur Test. Kein Rapport und kein richtiger Index.</p>

<h3>1. Anmeldung</h3>
<input id="username" placeholder="Monteur-Name, z.B. peter">
<input id="password" type="password" placeholder="Passwort">
<button id="workerLogin">Monteur anmelden</button>
<button id="googleLogin" class="admin">Admin mit Google</button>
<button id="logout" disabled>Abmelden</button>
<div id="who" class="small">Nicht angemeldet</div>

<h3>2. Auftrag testen</h3>
<input id="nr" placeholder="Auftragsnummer, z.B. 12345">
<input id="target" placeholder="Monteur-Name, z.B. peter">
<button id="save" disabled>Admin: Auftrag speichern</button>
<button id="load" disabled>Meine Aufträge laden</button>
<div id="status">Bereit.</div>
<div id="list"></div>

<hr><h3>🔎 Monitor</h3>
<button id="clear">Monitor löschen</button>
<pre id="monitor"></pre>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,collection,getDocs,query,where,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDlGkAcBdJbBj-WlCoPrMya9ICzySJ7RVE",
  authDomain:"equans-rapport-test.firebaseapp.com",
  projectId:"equans-rapport-test",
  storageBucket:"equans-rapport-test.firebasestorage.app",
  messagingSenderId:"916807708145",
  appId:"1:916807708145:web:3c6d75cd06468684682850",
  measurementId:"G-VPHGE42TWN"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const provider=new GoogleAuthProvider();
let user=null,profile=null;
const $=id=>document.getElementById(id);
function log(t,m,d){let x="";try{x=d===undefined?"":" | "+JSON.stringify(d)}catch{};$("monitor").textContent+="["+new Date().toLocaleTimeString()+"] "+t+": "+m+x+"\n";$("monitor").scrollTop=$("monitor").scrollHeight}
function status(s){$("status").textContent=s;log("STATUS",s)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function profileOf(u){const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw new Error("Profil nicht gefunden");return s.data()}

onAuthStateChanged(auth,async u=>{
 user=u;profile=null;
 if(!u){$("who").textContent="Nicht angemeldet";$("save").disabled=$("load").disabled=$("logout").disabled=true;return}
 try{
   profile=await profileOf(u);
   $("who").textContent=(profile.displayName||profile.username||u.email)+" | Rolle: "+profile.role+" | UID: "+u.uid;
   $("logout").disabled=false;$("load").disabled=false;$("save").disabled=profile.role!=="admin";
   status("Login ✓");log("PROFIL","geladen",profile);
 }catch(e){status("PROFIL-FEHLER: "+e.message)}
});

$("workerLogin").onclick=async()=>{
 const name=$("username").value.trim().toLowerCase();
 if(!name){status("Monteur-Name fehlt.");return}
 try{status("Monteur Anmeldung …");await signInWithEmailAndPassword(auth,name+"@rapport.internal",$("password").value)}
 catch(e){status("LOGIN-FEHLER: "+e.code+" / "+e.message)}
};
$("googleLogin").onclick=async()=>{
 try{status("Google Admin Anmeldung …");await signInWithPopup(auth,provider)}
 catch(e){status("GOOGLE-FEHLER: "+e.code+" / "+e.message)}
};
$("logout").onclick=()=>signOut(auth);

$("save").onclick=async()=>{
 if(profile?.role!=="admin"){status("Nur Admin darf speichern.");return}
 const nr=$("nr").value.trim(), target=$("target").value.trim().toLowerCase();
 if(!nr||!target){status("Auftragsnummer und Monteur-Name fehlen.");return}
 try{
   status("Schreibe Testauftrag …");
   await setDoc(doc(db,"auftragTest",nr),{
     orderNumber:nr,assignedUsername:target,createdBy:user.uid,active:true,updatedAt:serverTimestamp()
   },{merge:true});
   status("Auftrag "+nr+" für "+target+" gespeichert ✓");
 }catch(e){
   status("SCHREIB-FEHLER: "+e.code+" / "+e.message);
   log("HINWEIS","Wenn permission-denied erscheint, blockieren die Firestore-Regeln die neue Collection auftragTest.");
 }
};

$("load").onclick=async()=>{
 try{
   status("Lese Aufträge …");
   let snap;
   if(profile?.role==="admin") snap=await getDocs(collection(db,"auftragTest"));
   else snap=await getDocs(query(collection(db,"auftragTest"),where("assignedUsername","==",String(profile?.username||"").toLowerCase())));
   const a=[];snap.forEach(d=>a.push(d.data()));
   $("list").innerHTML=a.length?a.map(x=>'<div class="row"><b>'+esc(x.orderNumber)+'</b> → '+esc(x.assignedUsername)+'</div>').join(""):'<div class="row">Keine Aufträge.</div>';
   status(a.length+" Auftrag/Aufträge geladen ✓");log("FIRESTORE","Ergebnis",a);
 }catch(e){
   status("LESE-FEHLER: "+e.code+" / "+e.message);
   log("HINWEIS","permission-denied = Firestore-Regeln müssen für auftragTest freigegeben werden.");
 }
};
$("clear").onclick=()=>{$("monitor").textContent=""};
log("START","Test V2 gestartet");
</script></body></html>
