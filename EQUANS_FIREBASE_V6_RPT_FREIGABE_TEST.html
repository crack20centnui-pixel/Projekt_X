<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EQUANS RPT Freigabe Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f5;margin:0;color:#18211d}
main{max-width:920px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #d8dfdb;border-radius:14px;padding:17px;margin:12px 0}
h1,h2{margin-top:0}.row{display:flex;gap:9px;flex-wrap:wrap}button,input{padding:10px 12px;border:1px solid #aeb8b2;border-radius:9px;background:#fff}
button{font-weight:650;cursor:pointer}.primary{background:#176b40;color:#fff;border-color:#176b40}.danger{background:#fff0f0}.mut{font-size:13px;color:#68736d}
input{min-width:260px}pre{white-space:pre-wrap;background:#f7f9f8;border-radius:9px;padding:13px;min-height:160px;max-height:430px;overflow:auto}
</style></head><body><main>
<div class="card"><h1>RPT Freigabe-Test V6</h1><div class="mut">Separater Firebase-Test. Kein Zugriff auf deinen echten Rapport-Index.</div></div>

<div class="card"><h2>1. Login</h2><div class="row">
<button id="google" class="primary">Google Admin Login</button><button id="worker">Monteur Login</button><button id="logout">Abmelden</button>
</div><p id="who" class="mut">Nicht angemeldet.</p></div>

<div class="card"><h2>2. Test-RPT</h2>
<div class="row"><input id="ownerUid" placeholder="Owner UID (z.B. Peter)"><input id="rptId" value="RPT-FREIGABE-TEST-001"></div><br>
<div class="row">
<button id="create" class="primary">Als Owner Test-RPT erstellen</button>
<button id="read">RPT lesen</button>
<button id="edit">RPT bearbeiten + Revision</button>
</div></div>

<div class="card"><h2>3. Admin Freigabe</h2>
<div class="row"><input id="shareUid" placeholder="UID des zweiten Monteurs (z.B. Max)"></div><br>
<div class="row">
<button id="grant">Freigabe erteilen</button>
<button id="revoke" class="danger">Freigabe entziehen</button>
</div><p class="mut">Nur Admin darf accessUids ändern. Es wird kein zweiter RPT erstellt.</p></div>

<div class="card"><h2>4. Protokoll</h2><pre id="log">Bereit.</pre></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDlGkAcBdJbBj-WlCoPrMya9ICzySJ7RVE",authDomain:"equans-rapport-test.firebaseapp.com",projectId:"equans-rapport-test",storageBucket:"equans-rapport-test.firebasestorage.app",messagingSenderId:"916807708145",appId:"1:916807708145:web:3c6d75cd06468684682850",measurementId:"G-VPHGE42TWN"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=x=>document.getElementById(x),L=$("log");
function log(x){L.textContent+="\n"+x;L.scrollTop=L.scrollHeight}
function me(){if(!auth.currentUser)throw Error("Bitte zuerst anmelden.");return auth.currentUser}
function ref(){const owner=$("ownerUid").value.trim(),id=$("rptId").value.trim();if(!owner||!id)throw Error("Owner UID und RPT-ID fehlen.");return doc(db,"monteure",owner,"rapporte",id)}

$("google").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){log("LOGIN ✗ "+e.message)}};
$("worker").onclick=async()=>{const u=prompt("Monteur Benutzername:");if(!u)return;const pw=prompt("Passwort:");if(!pw)return;try{await signInWithEmailAndPassword(auth,u.includes("@")?u:u+"@rapport.internal",pw)}catch(e){log("LOGIN ✗ "+e.message)}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 if(!u){$("who").textContent="Nicht angemeldet.";return}
 let role="?";try{const s=await getDoc(doc(db,"users",u.uid));role=s.exists()?(s.data().role||"?"):"?"}catch(e){}
 $("who").textContent=(u.displayName||u.email||u.uid)+" | UID: "+u.uid+" | Rolle: "+role;
 if(role==="monteur"&&!$("ownerUid").value)$("ownerUid").value=u.uid;
 log("LOGIN ✓ "+role+" | "+u.uid);
});

$("create").onclick=async()=>{
 try{
  const u=me(),owner=$("ownerUid").value.trim(),id=$("rptId").value.trim();
  if(owner!==u.uid)throw Error("Für diesen Test muss der angemeldete Monteur selbst Owner sein.");
  await setDoc(ref(),{
   rptId:id,ownerUid:u.uid,createdBy:u.uid,accessUids:[u.uid],
   revision:1,status:"in_bearbeitung",testText:"Erstellt vom Owner",
   deleted:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
  log("CREATE ✓ "+id+" | Revision 1 | nur EIN Dokument");
 }catch(e){log("CREATE ✗ "+e.message)}
};

$("read").onclick=async()=>{
 try{
  me();const s=await getDoc(ref());
  if(!s.exists())throw Error("RPT existiert nicht.");
  const d=s.data();
  log("READ ✓ "+d.rptId+" | owner="+d.ownerUid+" | revision="+d.revision+" | accessUids="+JSON.stringify(d.accessUids)+" | text="+d.testText);
 }catch(e){log("READ ✗ "+e.message)}
};

$("edit").onclick=async()=>{
 try{
  me();const r=ref(),s=await getDoc(r);if(!s.exists())throw Error("RPT existiert nicht.");
  const d=s.data(),next=Number(d.revision)+1;
  await updateDoc(r,{revision:next,testText:"Bearbeitet von "+auth.currentUser.uid+" um "+new Date().toLocaleString("de-CH"),updatedAt:serverTimestamp()});
  log("EDIT ✓ gleicher RPT | Revision "+d.revision+" → "+next);
 }catch(e){log("EDIT ✗ "+e.message)}
};

$("grant").onclick=async()=>{
 try{
  me();const target=$("shareUid").value.trim();if(!target)throw Error("Freigabe-UID fehlt.");
  const r=ref(),s=await getDoc(r);if(!s.exists())throw Error("RPT existiert nicht.");
  const d=s.data(),arr=Array.isArray(d.accessUids)?[...d.accessUids]:[];
  if(!arr.includes(target))arr.push(target);
  await updateDoc(r,{accessUids:arr,updatedAt:serverTimestamp()});
  log("FREIGABE ✓ "+target+" hat Zugriff auf denselben "+d.rptId);
 }catch(e){log("FREIGABE ✗ "+e.message)}
};

$("revoke").onclick=async()=>{
 try{
  me();const target=$("shareUid").value.trim();if(!target)throw Error("Freigabe-UID fehlt.");
  const r=ref(),s=await getDoc(r);if(!s.exists())throw Error("RPT existiert nicht.");
  const d=s.data(),arr=(d.accessUids||[]).filter(x=>x!==target);
  if(!arr.includes(d.ownerUid))arr.unshift(d.ownerUid);
  await updateDoc(r,{accessUids:arr,updatedAt:serverTimestamp()});
  log("ENTZOGEN ✓ "+target+" aus accessUids entfernt.");
 }catch(e){log("ENTZIEHEN ✗ "+e.message)}
};
</script></main></body></html>
