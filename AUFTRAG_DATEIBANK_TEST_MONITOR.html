<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auftrag-Dateibank Test</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f7;margin:0;padding:24px}
.box{max-width:720px;margin:auto;background:white;padding:22px;border-radius:14px;box-shadow:0 2px 12px #0002}
button,input{font-size:16px;padding:11px;border-radius:8px;border:1px solid #bbb}
button{cursor:pointer;margin:4px 4px 4px 0}
input{width:calc(100% - 24px);margin-top:10px}
#status{padding:10px;margin:12px 0;background:#eee;border-radius:8px}
#list{margin-top:12px;max-height:380px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:10px}
.row{padding:7px;border-bottom:1px solid #eee}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="box">
<h2>Auftrag-Dateibank – separater Test</h2>
<p>Nur Auftragsnummern lesen, lokal sichern und suchen. Kein Rapport/Index.</p>

<button id="login">1. Google Drive anmelden</button>
<button id="load" disabled>2. auftraege.json lesen</button>
<button id="local">Lokale Kopie anzeigen</button>

<div id="status">Bereit.</div>

<input id="search" placeholder="Auftragsnummer suchen …">
<div class="small">Lokaler Speicher: equans_auftragsnummern_v1</div>
<div id="list"></div>
<hr style="margin:22px 0">
<h3>🔎 Monitor / Fehlersuche</h3>
<div class="small">Hier sehen wir Schritt für Schritt, was funktioniert und wo es stoppt.</div>
<button id="clearLog">Monitor löschen</button>
<button id="copyLog">Monitor kopieren</button>
<pre id="monitor" style="background:#111;color:#eee;padding:12px;border-radius:8px;max-height:360px;overflow:auto;white-space:pre-wrap;font-size:12px"></pre>
</div>

<script>
const CLIENT_ID="916807708145-svmug44l4usafautgf70vfoapisuno33.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.file";
const LOCAL_KEY="equans_auftragsnummern_v1";

let token="";
let numbers=[];

const $=id=>document.getElementById(id);
const status=t=>{$("status").textContent=t; log("STATUS",t)};

function log(type,msg,data){
  const box=$("monitor");
  if(!box)return;
  const time=new Date().toLocaleTimeString();
  let extra="";
  if(data!==undefined){
    try{extra=" | "+(typeof data==="string"?data:JSON.stringify(data))}
    catch{extra=" | [nicht darstellbar]"}
  }
  box.textContent+="["+time+"] "+type+": "+msg+extra+"\n";
  box.scrollTop=box.scrollHeight;
}
window.addEventListener("error",e=>log("JS-FEHLER",e.message+" @ "+e.filename+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>log("PROMISE-FEHLER",String(e.reason)));


function normalize(a){
  return [...new Set((a||[]).map(x=>String(x).trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"de",{numeric:true}));
}
function saveLocal(a){
  numbers=normalize(a);
  localStorage.setItem(LOCAL_KEY,JSON.stringify(numbers));
  render();
}
function readLocal(){
  try{return normalize(JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]"))}
  catch{return []}
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const a=q?numbers.filter(x=>x.toLowerCase().includes(q)):numbers;
  $("list").innerHTML=a.length
    ? a.map(x=>'<div class="row">'+x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</div>').join("")
    : '<div class="row">Keine Auftragsnummern.</div>';
}

async function api(url){
  log("HTTP","GET "+url.replace(/fields=[^&]+/,"fields=…"));
  const started=Date.now();
  try{
    const r=await fetch(url,{headers:{Authorization:"Bearer "+token}});
    const txt=await r.text();
    log("HTTP","Antwort "+r.status+" ("+(Date.now()-started)+" ms)",txt.slice(0,500));
    if(!r.ok) throw new Error("HTTP "+r.status+": "+txt);
    return txt;
  }catch(e){
    log("HTTP-FEHLER",e.message);
    throw e;
  }
}

async function findFile(){
  log("SCHRITT","findFile() gestartet");
  status("Suche auftraege.json in deinem Drive …");
  const q=encodeURIComponent("name='auftraege.json' and trashed=false");
  const txt=await api("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name,modifiedTime,parents)&orderBy=modifiedTime desc");
  const data=JSON.parse(txt);
  if(!data.files || !data.files.length) throw new Error("auftraege.json wurde nicht gefunden.");
  log("DRIVE","Datei gefunden",{id:data.files[0].id,name:data.files[0].name,modifiedTime:data.files[0].modifiedTime});
  return data.files[0];
}

async function loadDrive(){
  log("SCHRITT","loadDrive() gestartet");
  if(!token){status("Bitte zuerst Google Drive anmelden.");return}
  try{
    const f=await findFile();
    status("Gefunden. Datei wird gelesen …");
    const txt=await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.id)+"?alt=media");
    const data=JSON.parse(txt);
    if(!Array.isArray(data.auftraege)) throw new Error('JSON enthält kein Feld "auftraege".');
    log("JSON","auftraege Feld gelesen",{anzahl:data.auftraege.length,beispiel:data.auftraege.slice(0,10)});
    saveLocal(data.auftraege);
    log("LOCAL","localStorage gespeichert",{key:LOCAL_KEY,anzahl:numbers.length});
    status("✓ "+numbers.length+" Auftragsnummern aus Drive gelesen und auf diesem Gerät gespeichert.");
  }catch(e){
    console.error(e);
    status("FEHLER: "+e.message);
  }
}

$("login").onclick=()=>{
  log("KLICK","Google Drive anmelden");
  log("SYSTEM","Google OAuth verfügbar: "+!!window.google?.accounts?.oauth2);
  if(!window.google?.accounts?.oauth2){
    status("Google Login ist noch nicht geladen. Bitte 2 Sekunden warten und nochmals drücken.");
    return;
  }
  const client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPE,
    callback:r=>{
      log("OAUTH","Callback erhalten",{error:r.error||null,tokenVorhanden:!!r.access_token});
      if(r.error){status("Google Fehler: "+r.error);return}
      token=r.access_token;
      $("load").disabled=false;
      status("✓ Google Drive angemeldet. Jetzt «auftraege.json lesen» drücken.");
    }
  });
  client.requestAccessToken({prompt:"consent"});
};

$("load").onclick=loadDrive;
$("local").onclick=()=>{
  numbers=readLocal();
  render();
  status("Lokale Kopie: "+numbers.length+" Auftragsnummern.");
};
$("search").oninput=render;

$("clearLog").onclick=()=>{$("monitor").textContent="";log("MONITOR","gelöscht")};
$("copyLog").onclick=async()=>{
  try{await navigator.clipboard.writeText($("monitor").textContent);status("Monitor kopiert ✓")}
  catch(e){log("KOPIEREN-FEHLER",e.message);status("Kopieren nicht möglich")}
};

log("START","Testseite gestartet");
log("SYSTEM","URL "+location.href);
log("SYSTEM","Online: "+navigator.onLine);
log("SYSTEM","Google Script aktuell verfügbar: "+!!window.google?.accounts?.oauth2);
numbers=readLocal();
log("LOCAL","Vorhandene lokale Nummern: "+numbers.length);
render();
setTimeout(()=>log("SYSTEM","Google Script nach 2s verfügbar: "+!!window.google?.accounts?.oauth2),2000);
</script>
</body>
</html>
