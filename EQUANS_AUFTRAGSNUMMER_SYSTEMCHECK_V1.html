<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EQUANS Auftragnummer Systemcheck</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7f8;margin:0;color:#18323a}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #cfdadd;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}h1{margin:0 0 5px;font-size:24px}h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px 12px;border:1px solid #b9c8cc;border-radius:8px}input{flex:1;min-width:190px}button{cursor:pointer;background:#176b55;color:#fff;font-weight:700}.secondary{background:#49646c}.danger{background:#b92d2d}.status{white-space:pre-wrap;background:#102126;color:#e9ffff;border-radius:9px;padding:12px;min-height:100px;font-family:ui-monospace,monospace;font-size:13px}.ok{color:#087b42;font-weight:700}.bad{color:#b21f2d;font-weight:700}.muted{color:#65777d;font-size:13px}.suggest{border:1px solid #ccd7da;border-radius:8px;margin-top:5px;overflow:hidden}.suggest button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e2e8ea;border-radius:0;background:white;color:#17363f;font-weight:400}.suggest button:hover{background:#edf6f3}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf3f0;margin:2px;font-size:12px}</style></head><body><div class="wrap">
<div class="card"><h1>Auftragsnummer – Systemcheck</h1><div class="muted">Prüft nur Master-Auftragsliste, lokalen Cache und Vorschläge. Keine Rapporte werden verändert.</div></div>
<div class="card"><h2>1. Anmeldung</h2><div class="row"><input id="user" placeholder="Monteur Benutzername oder E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="login">Monteur anmelden</button><button id="google" class="secondary">Google Admin</button><button id="logout" class="danger">Abmelden</button></div><div id="who" class="muted" style="margin-top:8px">Nicht angemeldet</div></div>
<div class="card"><h2>2. Master prüfen</h2><div class="row"><button id="check">Systemcheck starten</button><button id="syncCache" class="secondary">Master → lokal speichern</button></div><div id="masterList" style="margin-top:10px"></div></div>
<div class="card"><h2>3. Vorschlag testen</h2><div class="muted">Tippe z.B. <b>K</b>, <b>12</b> oder <b>1</b>. Die Suche liest nur den lokalen Cache.</div><input id="auftrag" autocomplete="off" placeholder="Auftragsnummer eingeben …" style="width:100%;box-sizing:border-box;margin-top:8px"><div id="suggest" class="suggest" style="display:none"></div><div id="picked" class="muted" style="margin-top:8px"></div></div>
<div class="card"><h2>Log</h2><div id="log" class="status">Bereit.</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDlGkAcBdJbBj-WlCoPrMya9ICzySJ7RVE",authDomain:"equans-rapport-test.firebaseapp.com",projectId:"equans-rapport-test",storageBucket:"equans-rapport-test.firebasestorage.app",messagingSenderId:"916807708145",appId:"1:916807708145:web:3c6d75cd06468684682850",measurementId:"G-VPHGE42TWN"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);let profile=null,master=null;
function out(s,append=true){$('log').textContent=(append?$('log').textContent+'\n':'')+s}
function email(v){v=String(v||'').trim().toLowerCase();return v.includes('@')?v:v+'@rapport.internal'}
function normalize(x){if(typeof x==='string')return {orderNumber:x,name:'',active:true};return {orderNumber:String(x?.orderNumber??x?.nummer??'').trim(),name:String(x?.name??x?.bezeichnung??''),active:x?.active!==false}}
async function readProfile(u){const s=await getDoc(doc(db,'users',u.uid));if(!s.exists())throw Error('Benutzerprofil fehlt');return s.data()}
async function readMaster(){const s=await getDoc(doc(db,'admin','system','masterData','data'));if(!s.exists())throw Error('masterData/data fehlt');return s.data()}
function localMaster(){try{return JSON.parse(localStorage.getItem('equansMasterDataV1')||'null')}catch{return null}}
function list(m){return (Array.isArray(m?.auftraege)?m.auftraege:[]).map(normalize).filter(x=>x.orderNumber&&x.active)}
function renderMaster(m){const a=list(m);$('masterList').innerHTML=a.length?a.map(x=>`<span class="pill">${x.orderNumber}${x.name?' · '+x.name:''}</span>`).join(''):'<span class="bad">Keine aktiven Nummern</span>'}
async function fullCheck(){out('=== AUFTRAGSNUMMER SYSTEMCHECK ===',false);try{const u=auth.currentUser;if(!u)throw Error('Nicht angemeldet');out('✓ Auth: '+u.uid);profile=await readProfile(u);out('✓ Profil: '+profile.role+' / active='+profile.active);master=await readMaster();const a=list(master);out('✓ Firebase MasterData: Version '+Number(master.version||0)+' / '+a.length+' aktive Nummern');renderMaster(master);const lm=localMaster();if(lm){out('✓ Lokaler Cache vorhanden: Version '+Number(lm.version||0)+' / '+list(lm).length+' aktive Nummern');if(Number(lm.version||0)===Number(master.version||0))out('✓ Cache-Version stimmt mit Firebase überein');else out('⚠ Cache-Version weicht ab – einmal Master → lokal speichern oder normal SYNC ausführen')}else out('⚠ Lokaler Cache fehlt');out('✓ Vorschlagssuche kann aus lokalem Cache arbeiten');}catch(e){out('✗ '+(e.message||e))}}
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,email($('user').value),$('pw').value)}catch(e){out('Login Fehler: '+e.message,false)}};
$('google').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){out('Google Login Fehler: '+e.message,false)}};
$('logout').onclick=()=>signOut(auth);$('check').onclick=fullCheck;
$('syncCache').onclick=async()=>{try{master=await readMaster();localStorage.setItem('equansMasterDataV1',JSON.stringify(master));renderMaster(master);out('✓ MasterData in equansMasterDataV1 gespeichert. Version '+Number(master.version||0),false)}catch(e){out('✗ '+e.message,false)}};
$('auftrag').addEventListener('input',()=>{const q=$('auftrag').value.trim().toLowerCase(),m=localMaster(),a=list(m).filter(x=>!q||x.orderNumber.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).slice(0,20);const box=$('suggest');box.innerHTML='';if(!q||!a.length){box.style.display='none';$('picked').textContent=q&&!a.length?'Keine Master-Vorschläge – freie Nummer wäre external.':'';return}a.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.orderNumber+(x.name?' — '+x.name:'');b.onclick=()=>{$('auftrag').value=x.orderNumber;box.style.display='none';$('picked').innerHTML='<span class="ok">✓ Master-Auftragsnummer gewählt: '+x.orderNumber+'</span>'};box.appendChild(b)});box.style.display='block'});
onAuthStateChanged(auth,async u=>{if(!u){profile=null;$('who').textContent='Nicht angemeldet';return}try{profile=await readProfile(u);$('who').innerHTML='<span class="ok">✓ '+(profile.displayName||profile.username||u.email)+' · '+profile.role+'</span>';await fullCheck()}catch(e){$('who').innerHTML='<span class="bad">✗ '+e.message+'</span>'}});
</script></body></html>
