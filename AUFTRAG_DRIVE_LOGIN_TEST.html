<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auftrag Drive Test</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:16px}
button,input{font-size:16px;padding:10px;margin:5px 0}
input{width:95%} #status{margin:12px 0;font-weight:bold}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Nur Test: Auftragsnummern aus Drive</h2>
<p>Dieser Test verändert deinen Index nicht.</p>
<button id="login">Google anmelden + auftraege.json laden</button>
<div id="status">Bereit</div>
<input id="search" placeholder="Auftragsnummer suchen …" disabled>
<pre id="result">Noch nichts geladen.</pre>

<script>
const CLIENT_ID="916807708145-svmug44l4usafautgf70vfoapisuno33.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.file";
let tokenClient, numbers=[];

const status=t=>document.getElementById("status").textContent=t;

async function driveFetch(url, token){
  const r=await fetch(url,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("Drive HTTP "+r.status+" – "+await r.text());
  return r;
}
async function findJson(token){
  const q=encodeURIComponent("name='auftraege.json' and trashed=false");
  const r=await driveFetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc",token);
  const j=await r.json();
  if(!j.files?.length) throw new Error("auftraege.json nicht gefunden");
  return j.files[0];
}
async function loadJson(token){
  status("Suche auftraege.json …");
  const f=await findJson(token);
  status("Lade "+f.name+" …");
  const r=await driveFetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.id)+"?alt=media",token);
  const j=await r.json();
  numbers=Array.isArray(j.auftraege)?j.auftraege.map(String):[];
  localStorage.setItem("equans_auftragsnummern_v1",JSON.stringify(numbers));
  document.getElementById("search").disabled=false;
  document.getElementById("result").textContent=
    "Geladen: "+numbers.length+" Nummern\n\n"+numbers.join("\n");
  status("✓ Drive gelesen und lokal gespeichert");
}
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  const hits=numbers.filter(n=>n.toLowerCase().includes(q)).slice(0,30);
  document.getElementById("result").textContent=hits.join("\n")||"Kein Treffer";
});
document.getElementById("login").onclick=()=>{
  if(!window.google?.accounts?.oauth2){status("Google Login noch nicht geladen – kurz warten.");return}
  if(!tokenClient){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPE,
      callback:async r=>{
        if(r.error){status("Login Fehler: "+r.error);return}
        try{await loadJson(r.access_token)}
        catch(e){console.error(e);status("FEHLER: "+e.message)}
      }
    });
  }
  tokenClient.requestAccessToken({prompt:""});
};
</script>
</body>
</html>
